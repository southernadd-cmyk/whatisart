<!doctype html>
<html lang="en">
<head>
  <script>document.documentElement.classList.add('ready');</script>
  <style>html { visibility: hidden; } html.ready { visibility: visible; }</style>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>What Is Art Comic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body data-page="artist">

  <div class="reel-backdrop" id="reelBackdrop" aria-hidden="true"></div>
  <button type="button" class="reel-sound-btn" id="reelSoundBtn" hidden aria-pressed="false" aria-label="Turn sound on for the background reel">Sound on</button>

  <div class="atmosphere" aria-hidden="true">
    <div class="atmosphere__grain"></div>
    <div class="atmosphere__scan"></div>
    <div class="atmosphere__grid"></div>
  </div>

  <header class="concept-shell concept-shell--compact">
    <div class="concept-shell__meta">
      <span class="specimen-id"><a href="./index.html" class="back-link">← Index</a></span>
      <span class="specimen-id specimen-id--right" id="postDate"></span>
    </div>
  </header>

  <main class="page page--artist" id="main">
    <div id="appError" class="app-error" role="alert"></div>
    <div id="artistPage">

      <div class="stage stage--artist">
        <div class="stage__titleblock stage__titleblock--artist">
          <h1 class="site-title site-title--artist" id="artistName"></h1>
        </div>
        <div class="artist-step-nav" id="artistStepNav" aria-label="Browse artists"></div>
      </div>

      <!-- Comic strip with page-turn nav -->
      <section class="comic-section">

        <!-- The strip is wrapped in a flip-stage for the 3D turn effect -->
        <div class="flip-stage" id="flipStage">
          <div class="flip-card" id="flipCard">
            <div class="flip-card__face flip-card__face--front">
              <div class="strip-1x4" id="panelStrip"></div>
            </div>
            <div class="flip-card__face flip-card__face--back">
              <div class="strip-1x4" id="panelStripBack"></div>
            </div>
          </div>
        </div>

        <!-- Nav row: prev artist / hi-res / next artist -->
        <div class="comic-nav">
          <button type="button" class="comic-nav__btn comic-nav__btn--prev" id="prevBtn" aria-label="Previous artist">
            <span class="comic-nav__arrow" aria-hidden="true">←</span>
            <span class="comic-nav__label" id="prevLabel"></span>
          </button>

          <button type="button" class="hires-btn" id="hiresBtn" disabled>
            <span class="hires-btn__icon" aria-hidden="true">⬛</span>
            <span>View hi-res</span>
          </button>

          <button type="button" class="comic-nav__btn comic-nav__btn--next" id="nextBtn" aria-label="Next artist">
            <span class="comic-nav__label" id="nextLabel"></span>
            <span class="comic-nav__arrow" aria-hidden="true">→</span>
          </button>
        </div>

      </section>

      <!-- Haiku -->
      <aside class="haiku-box" style="margin-top: 20px;">
        <p class="haiku-label">Haiku</p>
        <pre class="haiku" id="haikuText"></pre>
      </aside>

    </div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
